# Server
server.port=${SERVER_PORT:8080}
spring.application.name=nexusmarket

# MySQL (relational model). Under Docker Compose DB_URL points to mysql-db.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nexus_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate: tables are created automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# MongoDB (audit trail). Spring Boot 4 uses the spring.mongodb prefix.
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/audit_db}

# JWT. Academic default secret (public!): override JWT_SECRET outside your machine.
jwt.secret=${JWT_SECRET:NEXUSMARKET-NEXUSMARKET-NEXUSMARKET-2026}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Business parameters
business.tax-rate=${TAX_RATE:0.19}
business.return-window-days=${RETURN_WINDOW_DAYS:30}
business.payment-expiration-minutes=${PAYMENT_EXPIRATION_MINUTES:60}
business.low-stock-threshold=${LOW_STOCK_THRESHOLD:5}
business.expiration-check-ms=60000

# Demo data (users with password Password123*)
app.seed.enabled=${SEED_ENABLED:true}

# Actuator
management.endpoints.web.exposure.include=health
